[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goselect-docproc"
version = "0.1.0"
description = "Segment-level document processing for the ABB GoSelect Copilot pipeline"
requires-python = ">=3.11"
# Runtime dependencies live in requirements.txt so there is one list, not two.
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[project.scripts]
goselect-docproc = "goselect_docproc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
